[build-system]
# PEP 639 license expressions and project.license-files require this backend API.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-kiokuko"
version = "0.1.24"
description = "Scoped, human-approved memory for Hermes Agent"
readme = "README.md"
authors = [{name = "dkc"}]
license = "MIT"
license-files = ["LICENSE"]
# tomllib is part of the standard library from Python 3.11 onward.
requires-python = ">=3.11"
# safe_dump(sort_keys=...) was added in 5.1; safe behavior is also probed at runtime.
dependencies = ["PyYAML>=5.1"]

[project.scripts]
kioku-curation = "hermes_kiokuko.curation:main"

[project.optional-dependencies]
# The builtin pythonpath configuration used below was added in pytest 7.
test = ["pytest>=7", "PyYAML>=5.1", "build"]

[project.entry-points."hermes_agent.plugins"]
kiokuko-tools = "hermes_kiokuko.plugin_entry"

[project.entry-points."hermes_agent.memory_providers"]
kiokuko = "hermes_kiokuko.memory_plugin:register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_kiokuko = ["migrations/*.sql", "plugin.yaml", "skills/**/*.md", "orca/*", "_vendor/orca_trace/py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["hermes: tests against the audited Hermes source checkout"]
